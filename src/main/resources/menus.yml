# ============================================================
# Skulls - menus.yml
# ปรับแต่งเมนูและไอเท็มได้อิสระ
# ทุกไอเท็มรองรับ: material, texture, player_head, slot, slots,
# display_name, lore, item_model, custom_model_data, glow, amount, enabled
# ถ้าต้องการเว้นบรรทัดใน lore ให้ใส่ - แค่ตัวเดียว
# ถ้าไม่กำหนด material จะใช้ไอเท็มเดิมของเมนูนั้น
# item_model ต้องมีโมเดลใน resource pack เช่น minecraft:custom/head
# custom_model_data ต้องมี predicate ใน resource pack ของ material นั้น
# background คือไอเท็มพื้นหลังของทุกเมนู
# ถ้าต้องการพื้นหลังเฉพาะเมนู ให้เพิ่ม background ใต้เมนูนั้น
# ============================================================
background:
